name: Test Code Samples
'on':
  push:
    branches:
    - main
    paths:
    - static/include/examples/**
    - .github/workflows/test-code-snippets.yml
  schedule:
  - cron: 0 9 * * 1
  workflow_dispatch: null
jobs:
  test-code-samples:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'wdrx70xn'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Start viam-server in background
      run: "\n# Start viam-server in background and save PID\nsudo curl -H \"key_id:1030f25a-f4f2-4872-9762-e33fa1e0444d\"\
        \ -H \"key:$TEST_MACHINE_KEY\" \"https://app.viam.com/api/json1/config?id=deb8782c-7b48-4d35-812d-2caa94b61f77&client=true\"\
        \ -o /etc/viam.json\nuname -m\ncurl https://storage.googleapis.com/packages.viam.com/apps/viam-server/viam-server-stable-x86_64.AppImage\
        \ -o viam-server && chmod 755 viam-server && sudo ./viam-server --config /etc/viam.json\
        \ &\nVIAM_PID=$!\necho \"VIAM_PID=$VIAM_PID\" >> $GITHUB_ENV\necho \"Started\
        \ viam-server with PID: $VIAM_PID\"\n\n# Wait a moment for it to start\nsleep\
        \ 5\n\n# Check if it's running\nif ps -p $VIAM_PID > /dev/null; then\n  echo\
        \ \"viam-server is running with PID: $VIAM_PID\"\nelse\n  echo \"Failed to\
        \ start viam-server\"\n  exit 1\nfi\n"
      env:
        VIAM_API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}
        VIAM_API_KEY: ${{ secrets.VIAM_API_KEY }}
        VIAM_PART_ID: 824b6570-7b1d-4622-a19d-37c472dba467
        TEST_MACHINE_KEY: ${{ secrets.TEST_MACHINE_KEY }}
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install viam-sdk

        pip install asyncio

        pip install pytest

        pip install pytest-asyncio

        pip install numpy

        pip install pillow

        '
    - name: Find and list Python files
      run: 'echo "Found Python files in examples directory:"

        find static/include/examples -name "*.py" -type f | sort

        '
    - name: Test Python code samples
      if: github.repository_owner == 'viamrobotics'
      run: "# Find all Python files in the examples directory\npython_files=($(find\
        \ static/include/examples -name \"*.py\" -type f | xargs))\n\n# Initialize\
        \ counters\ntotal_files_py=0\npassed_files_py=0\nfailed_files_py=0\n\necho\
        \ \"Starting to test Python code samples...\"\necho \"========================================\"\
        \n\nfor file in \"${python_files[@]}\"; do\n  echo \"Testing: $file\"\n  total_files_py=$((total_files_py\
        \ + 1))\n\n  # Run the test with environment variables explicitly passed\n\
        \  if VIAM_API_KEY=\"$VIAM_API_KEY\" VIAM_API_KEY_ID=\"$VIAM_API_KEY_ID\"\
        \ TEST_ORG_ID=\"$TEST_ORG_ID\" VIAM_API_KEY_DATA_REGIONS=\"$VIAM_API_KEY_DATA_REGIONS\"\
        \ VIAM_API_KEY_ID_DATA_REGIONS=\"$VIAM_API_KEY_ID_DATA_REGIONS\" python \"\
        $file\"; then\n    passed_files_py=$((passed_files_py + 1))\n    echo \"\u2705\
        \ PASSED: $file\"\n  else\n    failed_files_py=$((failed_files_py + 1))\n\
        \    echo \"\u274C FAILED: $file\"\n  fi\n\n  echo \"----------------------------------------\"\
        \ndone\n\n# Summary\necho \"========================================\"\necho\
        \ \"TEST SUMMARY:\"\necho \"Total files tested: $total_files_py\"\necho \"\
        Passed: $passed_files_py\"\necho \"Failed: $failed_files_py\"\necho \"Skipped:\
        \ $((total_files_py - passed_files_py - failed_files_py))\"\n\n# Save results\
        \ for later use\necho \"total=$total_files_py\" >> $GITHUB_OUTPUT\necho \"\
        passed=$passed_files_py\" >> $GITHUB_OUTPUT\necho \"failed=$failed_files_py\"\
        \ >> $GITHUB_OUTPUT\n\n# Exit with failure if any tests failed\nif [ $failed_files_py\
        \ -gt 0 ]; then\n  exit 1\nfi\n"
      env:
        VIAM_API_KEY: ${{ secrets.VIAM_API_KEY }}
        VIAM_API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}
        TEST_ORG_ID: ${{ secrets.TEST_ORG_ID }}
        VIAM_API_KEY_DATA_REGIONS: ${{ secrets.VIAM_API_KEY_DATA_REGIONS }}
        VIAM_API_KEY_ID_DATA_REGIONS: ${{ secrets.VIAM_API_KEY_ID_DATA_REGIONS }}
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: static/include/examples/go.mod
    - name: Find and list Go files
      run: 'echo "Found Go files in examples directory:"

        find static/include/examples -name "*.go" -type f | sort

        '
    - name: Test Go code samples
      if: github.repository_owner == 'viamrobotics'
      run: "# Find all Go files in the examples directory\ngo_files=($(find static/include/examples\
        \ -name \"*.go\" -type f | xargs))\n\n# Initialize counters\ntotal_files_go=0\n\
        passed_files_go=0\nfailed_files_go=0\n\necho \"Starting to test Go code samples...\"\
        \necho \"========================================\"\n\nfor file in \"${go_files[@]}\"\
        ; do\n  echo \"Testing: $file\"\n  total_files_go=$((total_files_go + 1))\n\
        \n  # Get the directory and filename more safely\n  file_dir=$(dirname \"\
        $file\")\n  file_name=$(basename \"$file\")\n\n  echo \"File directory: $file_dir\"\
        \n  echo \"File name: $file_name\"\n\n  # Check if directory exists before\
        \ changing to it\n  if [ -d \"$file_dir\" ]; then\n    if (cd \"$file_dir\"\
        \ && VIAM_API_KEY=\"$VIAM_API_KEY\" VIAM_API_KEY_ID=\"$VIAM_API_KEY_ID\" TEST_ORG_ID=\"\
        $TEST_ORG_ID\" go run \"$file_name\"); then\n      passed_files_go=$((passed_files_go\
        \ + 1))\n      echo \"\u2705 PASSED: $file\"\n    else\n      failed_files_go=$((failed_files_go\
        \ + 1))\n      echo \"\u274C FAILED: $file\"\n    fi\n  else\n    failed_files_go=$((failed_files_go\
        \ + 1))\n    echo \"\u274C FAILED: Directory does not exist: $file_dir\"\n\
        \  fi\n\n  echo \"----------------------------------------\"\ndone\n\n# Summary\n\
        echo \"========================================\"\necho \"TEST SUMMARY:\"\n\
        echo \"Total files tested: $total_files_go\"\necho \"Passed: $passed_files_go\"\
        \necho \"Failed: $failed_files_go\"\necho \"Skipped: $((total_files_go - passed_files_go\
        \ - failed_files_go))\"\n\n# Save results for later use\necho \"total=$total_files_go\"\
        \ >> $GITHUB_OUTPUT\necho \"passed=$passed_files_go\" >> $GITHUB_OUTPUT\n\
        echo \"failed=$failed_files_go\" >> $GITHUB_OUTPUT\n\n# Exit with failure\
        \ if any tests failed\nif [ $failed_files_go -gt 0 ]; then\n  exit 1\nfi\n"
      env:
        VIAM_API_KEY: ${{ secrets.VIAM_API_KEY }}
        VIAM_API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}
        TEST_ORG_ID: ${{ secrets.TEST_ORG_ID }}
        VIAM_API_KEY_DATA_REGIONS: ${{ secrets.VIAM_API_KEY_DATA_REGIONS }}
        VIAM_API_KEY_ID_DATA_REGIONS: ${{ secrets.VIAM_API_KEY_ID_DATA_REGIONS }}
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'
    - name: Install dependencies
      run: npm install
    - name: Find and list TypeScript files
      run: 'echo "Found TypeScript files in examples directory:"

        find static/include/examples -name "*.ts" -type f | sort

        '
    - name: Test TypeScript code samples
      if: github.repository_owner == 'viamrobotics'
      run: "# Find all TypeScript files in the examples directory\nts_files=($(find\
        \ static/include/examples -name \"*.ts\" -type f | xargs))\n\n# Initialize\
        \ counters\ntotal_files_ts=0\npassed_files_ts=0\nfailed_files_ts=0\n\necho\
        \ \"Starting to test TypeScript code samples...\"\necho \"========================================\"\
        \n\nfor file in \"${ts_files[@]}\"; do\n  echo \"Testing: $file\"\n  total_files_ts=$((total_files_ts\
        \ + 1))\n\n  # Run the test with environment variables explicitly passed\n\
        \  if VIAM_API_KEY=\"$VIAM_API_KEY\" VIAM_API_KEY_ID=\"$VIAM_API_KEY_ID\"\
        \ TEST_ORG_ID=\"$TEST_ORG_ID\" VIAM_API_KEY_DATA_REGIONS=\"$VIAM_API_KEY_DATA_REGIONS\"\
        \ VIAM_API_KEY_ID_DATA_REGIONS=\"$VIAM_API_KEY_ID_DATA_REGIONS\" node \"$file\"\
        ; then\n    passed_files_ts=$((passed_files_ts + 1))\n    echo \"\u2705 PASSED:\
        \ $file\"\n  else\n    failed_files_ts=$((failed_files_ts + 1))\n    echo\
        \ \"\u274C FAILED: $file\"\n  fi\n\n  echo \"----------------------------------------\"\
        \ndone\n\n# Summary\necho \"========================================\"\necho\
        \ \"TEST SUMMARY:\"\necho \"Total files tested: $total_files_ts\"\necho \"\
        Passed: $passed_files_ts\"\necho \"Failed: $failed_files_ts\"\necho \"Skipped:\
        \ $((total_files_ts - passed_files_ts - failed_files_ts))\"\n\n# Save results\
        \ for later use\necho \"total=$total_files_ts\" >> $GITHUB_OUTPUT\necho \"\
        passed=$passed_files_ts\" >> $GITHUB_OUTPUT\necho \"failed=$failed_files_ts\"\
        \ >> $GITHUB_OUTPUT\n\n# Exit with failure if any tests failed\nif [ $failed_files_ts\
        \ -gt 0 ]; then\n  exit 1\nfi\n"
      env:
        VIAM_API_KEY: ${{ secrets.VIAM_API_KEY }}
        VIAM_API_KEY_ID: ${{ secrets.VIAM_API_KEY_ID }}
        TEST_ORG_ID: ${{ secrets.TEST_ORG_ID }}
        VIAM_API_KEY_DATA_REGIONS: ${{ secrets.VIAM_API_KEY_DATA_REGIONS }}
        VIAM_API_KEY_ID_DATA_REGIONS: ${{ secrets.VIAM_API_KEY_ID_DATA_REGIONS }}
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
    - name: Stop viam-server
      if: always()
      run: "if [ ! -z \"$VIAM_PID\" ]; then\n  echo \"Stopping viam-server with PID:\
        \ $VIAM_PID\"\n  sudo kill $VIAM_PID 2>/dev/null || true\n\n  # Wait for it\
        \ to stop gracefully\n  for i in {1..10}; do\n    if ! ps -p $VIAM_PID > /dev/null\
        \ 2>&1; then\n      echo \"viam-server stopped gracefully\"\n      break\n\
        \    fi\n    sleep 1\n  done\n\n  # Force kill if still running\n  if ps -p\
        \ $VIAM_PID > /dev/null 2>&1; then\n    echo \"Force killing viam-server\"\
        \n    sudo kill -9 $VIAM_PID 2>/dev/null || true\n  fi\nelse\n  echo \"No\
        \ viam-server PID found\"\nfi\n"
    - name: Login to Jira
      if: failure()
      uses: atlassian/gajira-login@v3
      env:
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    - name: Create Jira ticket
      if: failure()
      id: create
      uses: atlassian/gajira-create@v3
      env:
        GITHUB_RUN_ID: ${{ github.run_id }}
      with:
        project: DOCS
        issuetype: Bug
        summary: Code Sample Tests Failed
        description: For more info see https://github.com/viamrobotics/docs/actions/runs/${{
          env.GITHUB_RUN_ID }}.
    - name: Log created Jira issue
      if: failure()
      run: echo "Issue ${{ steps.create.outputs.issue }} was created"
